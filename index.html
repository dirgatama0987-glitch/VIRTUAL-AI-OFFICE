<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRX.AI</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- TOP BAR -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">◈</span>
        <span class="brand-text">DRX</span>
        <span class="brand-accent">.AI</span>
      </div>

      <nav class="top-nav" id="topNav">
        <button class="nav-item active" data-view="dashboard">Dashboard</button>
        <button class="nav-item" data-view="office">Virtual Office</button>
        <button class="nav-item" data-view="employees">AI Employees</button>
        <button class="nav-item" data-view="tasks">Task Manager</button>
        <button class="nav-item" data-view="chat">Communication</button>
        <button class="nav-item" data-view="meeting">Meeting Room</button>
        <button class="nav-item" data-view="projects">Projects</button>
        <button class="nav-item" data-view="finance">Finance</button>
        <button class="nav-item" data-view="analytics">Analytics</button>
        <button class="nav-item" data-view="documents">Documents</button>
        <button class="nav-item" data-view="ceo">CEO Center</button>
        <button class="nav-item" data-view="settings">Settings</button>
      </nav>

      <div class="top-right">
        <div class="system-status">
          <span class="status-dot"></span>
          SYSTEM ONLINE
        </div>
        <div class="clock" id="clock">00:00:00</div>
      </div>
    </header>

    <div class="main-layout">
      <!-- LEFT SIDEBAR -->
      <aside class="sidebar left-sidebar">
        <div class="sidebar-section">
          <div class="section-title">
            <span>◈ AGENTS</span>
            <button class="btn-icon" id="btnAddAgent" title="Recruit AI">+</button>
          </div>
          <div class="agent-list" id="agentList"></div>
        </div>

        <div class="sidebar-section">
          <div class="section-title">⌂ ROOMS</div>
          <div class="room-list" id="roomList">
            <div class="room-item active" data-room="all">All Rooms</div>
            <div class="room-item" data-room="ceo">CEO Office</div>
            <div class="room-item" data-room="marketing">Marketing</div>
            <div class="room-item" data-room="finance">Finance</div>
            <div class="room-item" data-room="dev">Development</div>
            <div class="room-item" data-room="content">Content Creation</div>
            <div class="room-item" data-room="meeting">Meeting Room</div>
            <div class="room-item" data-room="break">Break Room</div>
            <div class="room-item" data-room="reception">Reception</div>
          </div>
        </div>
      </aside>

      <!-- CENTER -->
      <main class="content" id="content"></main>

      <!-- RIGHT SIDEBAR -->
      <aside class="sidebar right-sidebar">
        <div class="monitor-header">
          <span>MONITOR</span>
          <span class="live-badge">● LIVE</span>
        </div>
        <div class="monitor-body" id="monitorBody"></div>
      </aside>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
